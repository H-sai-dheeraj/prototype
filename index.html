<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure AI Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="dot dot--pulse"></span>
      <span class="brand-text">SECURE AI WORKBENCH</span>
    </div>
    <button class="icon-btn" id="themeToggle" aria-label="Toggle theme">
      <svg class="icon icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon icon-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
    </button>
  </header>

  <main class="shell">

    <!-- ============================================================
         FILES PANEL
    ============================================================= -->
    <section class="files-panel" aria-label="Uploaded files">
      <h2 class="panel-title">Files</h2>

      <div class="dropzone" id="dropzone">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 21h14"/></svg>
        <span>Drag files here or <em>click to upload</em></span>
        <input type="file" id="fileInput" multiple hidden>
      </div>

      <ul class="file-list" id="fileList">
        <li class="file-list-empty" id="fileListEmpty">No files uploaded yet.</li>
      </ul>
    </section>

    <!-- ============================================================
         ASK PANEL
    ============================================================= -->
    <section class="ask-panel" aria-label="Ask a question">
      <div class="chat" id="chat">
        <div class="chat-empty" id="chatEmpty">
          Upload a file if you need to, then ask a question below.
        </div>
      </div>

      <form class="ask-form" id="askForm">
        <textarea id="askInput" rows="1" placeholder="Ask a question…" required></textarea>
        <button type="submit" class="btn btn--primary" id="askBtn">Ask</button>
      </form>
    </section>

  </main>

<script src="script.js"></script>
</body>
</html>
